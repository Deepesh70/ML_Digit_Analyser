name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  ci-checks:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "**/requirements*.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # --- Code Quality / Linting ---
      - name: Lint with Ruff
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          ruff check src/ app.py tests/ --select=E9,F63,F7,F82 --output-format=github
          # Warning check for general style
          ruff check src/ app.py tests/ --exit-zero

      # --- Unit & Integration Tests ---
      - name: Run Pytest Suite
        run: |
          pytest tests/ -v

      # --- Smoke Test ---
      - name: Smoke Test (Bytecode & Module Integrity)
        run: |
          python -m compileall -q src/ tests/ app.py
          echo "All application modules compiled cleanly."

